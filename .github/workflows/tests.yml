name: Python Tests

on: [push, pull_request]

jobs:
  test:
    # Keep Python 3.9 reproducible until the Python 3.12 migration (V2-F0-005).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: ORCH_DB="$(mktemp -d)/events.db" python -m pytest -q -p no:cacheprovider
